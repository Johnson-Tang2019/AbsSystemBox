name: Windows build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore SysBox.slnx --locked-mode
      - name: Build
        run: dotnet build SysBox.slnx -c Release --no-restore
      - name: Test
        run: dotnet test SysBox.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Verify WinUI publish resources
        run: |
          dotnet publish src/SysBox.App/SysBox.App.csproj -c Release --no-restore -p:Platform=x64 -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          foreach ($file in @('App.xbf','MainWindow.xbf','SysBox.App.pri','Themes/PinkTheme.xbf','Controls/BatteryCard.xbf','Views/RulesPage.xbf','Views/SearchPage.xbf','Views/StoragePage.xbf','Controls/StorageTreemap.xbf')) {
            if (-not (Test-Path (Join-Path artifacts/publish $file))) { throw "Missing WinUI resource: $file" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
